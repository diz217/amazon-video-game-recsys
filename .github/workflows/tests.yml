name: Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: python -m pip install "numpy>=1.24" "pandas>=2.0" "scipy>=1.10" "faiss-cpu>=1.8" "pytest>=8"
      - name: Run unit tests
        run: PYTHONPATH=src python -m pytest -q
